<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SafeTour</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f3f7ff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-card {
        background: white;
        width: 400px;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .logo {
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        color: #173b8f;
        margin-bottom: 10px;
      }

      .subtitle {
        text-align: center;
        color: #64748b;
        margin-bottom: 30px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-weight: 600;
        color: #172033;
      }

      input {
        width: 100%;
        padding: 13px;
        margin-bottom: 20px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
      }

      input:focus {
        outline: none;
        border-color: #173b8f;
      }

      .login-button {
        width: 100%;
        padding: 13px;
        background: #173b8f;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      .login-button:hover {
        background: #102d70;
      }

      .back {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #173b8f;
        text-decoration: none;
      }

      #message {
        text-align: center;
        margin-top: 15px;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div class="login-card">
      <div class="logo">🛡️ SafeTour</div>

      <p class="subtitle">Login to your SafeTour account</p>

      <form id="loginForm">
        <label>Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        />

        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        />

        <button type="submit" class="login-button">Login</button>
      </form>

      <p id="message"></p>

      <a href="/" class="back"> ← Back to Home </a>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          if (email && password) {
            window.location.href = "/dashboard.html";
          }
        });
    </script>
  </body>
</html>
