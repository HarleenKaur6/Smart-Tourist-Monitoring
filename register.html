<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SafeTour - Register</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #ffffff);
        min-height: 100vh;
        color: #172033;
      }

      .navbar {
        height: 75px;
        background: white;
        border-bottom: 1px solid #e5eaf1;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 7%;
      }

      .logo {
        font-size: 24px;
        font-weight: bold;
        color: #173b8f;
      }

      .back-home {
        text-decoration: none;
        color: #173b8f;
        font-size: 15px;
      }

      .container {
        min-height: calc(100vh - 75px);

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 50px 20px;
      }

      .register-card {
        width: 100%;
        max-width: 550px;

        background: white;
        padding: 40px;

        border-radius: 18px;

        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
      }

      .icon {
        width: 65px;
        height: 65px;

        margin: 0 auto 20px;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #e8f0ff;
        border-radius: 50%;

        font-size: 32px;
      }

      h1 {
        text-align: center;
        font-size: 30px;
        margin-bottom: 10px;
      }

      .subtitle {
        text-align: center;
        color: #667085;
        margin-bottom: 30px;
        line-height: 1.5;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #344054;
      }

      input,
      select {
        width: 100%;
        padding: 13px 14px;

        border: 1px solid #d0d5dd;
        border-radius: 8px;

        font-size: 15px;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: #173b8f;
        box-shadow: 0 0 0 3px #e8f0ff;
      }

      .emergency-box {
        background: #fff7ed;
        border: 1px solid #fed7aa;

        padding: 15px;
        border-radius: 10px;

        margin-bottom: 22px;
      }

      .emergency-title {
        font-weight: bold;
        color: #9a3412;
        margin-bottom: 5px;
      }

      .emergency-text {
        font-size: 13px;
        color: #7c2d12;
      }

      .register-btn {
        width: 100%;
        padding: 14px;

        background: #173b8f;
        color: white;

        border: none;
        border-radius: 8px;

        font-size: 16px;
        font-weight: 600;

        cursor: pointer;
      }

      .register-btn:hover {
        background: #102d70;
      }

      .login-text {
        text-align: center;
        margin-top: 22px;
        color: #667085;
        font-size: 14px;
      }

      .login-text a {
        color: #173b8f;
        font-weight: 600;
        text-decoration: none;
      }

      .security {
        text-align: center;
        margin-top: 20px;
        font-size: 12px;
        color: #667085;
      }

      @media (max-width: 600px) {
        .register-card {
          padding: 25px;
        }

        .form-row {
          grid-template-columns: 1fr;
          gap: 0;
        }

        h1 {
          font-size: 26px;
        }
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->

    <nav class="navbar">
      <div class="logo">🛡️ SafeTour</div>

      <a href="../index.html" class="back-home"> ← Back to Home </a>
    </nav>

    <!-- REGISTER FORM -->

    <main class="container">
      <div class="register-card">
        <div class="icon">🛡️</div>

        <h1>Create Tourist Account</h1>

        <p class="subtitle">
          Register with SafeTour and stay protected during your journey.
        </p>

        <form id="registerForm">
          <!-- NAME + PHONE -->

          <div class="form-row">
            <div class="form-group">
              <label for="name"> Full Name </label>

              <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
              />
            </div>

            <div class="form-group">
              <label for="phone"> Mobile Number </label>

              <input
                type="tel"
                id="phone"
                placeholder="Enter mobile number"
                required
              />
            </div>
          </div>

          <!-- EMAIL -->

          <div class="form-group">
            <label for="email"> Email Address </label>

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <!-- COUNTRY -->

          <div class="form-group">
            <label for="country"> Country </label>

            <select id="country" required>
              <option value="">Select your country</option>

              <option value="India">India</option>

              <option value="USA">United States</option>

              <option value="UK">United Kingdom</option>

              <option value="Canada">Canada</option>

              <option value="Australia">Australia</option>

              <option value="Other">Other</option>
            </select>
          </div>

          <!-- PASSWORD -->

          <div class="form-row">
            <div class="form-group">
              <label for="password"> Password </label>

              <input
                type="password"
                id="password"
                placeholder="Create password"
                required
              />
            </div>

            <div class="form-group">
              <label for="confirmPassword"> Confirm Password </label>

              <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required
              />
            </div>
          </div>

          <!-- EMERGENCY CONTACT -->

          <div class="emergency-box">
            <div class="emergency-title">🚨 Emergency Contact</div>

            <div class="emergency-text">
              This contact can be used during an emergency situation.
            </div>
          </div>

          <div class="form-group">
            <label for="emergencyName"> Emergency Contact Name </label>

            <input
              type="text"
              id="emergencyName"
              placeholder="Enter emergency contact name"
              required
            />
          </div>

          <div class="form-group">
            <label for="emergencyPhone"> Emergency Contact Number </label>

            <input
              type="tel"
              id="emergencyPhone"
              placeholder="Enter emergency contact number"
              required
            />
          </div>

          <!-- BUTTON -->

          <button type="submit" class="register-btn">
            Create Tourist Account
          </button>
        </form>

        <p class="login-text">
          Already have an account?

          <a href="#"> Login </a>
        </p>

        <p class="security">
          🔒 Your information is protected by SafeTour security.
        </p>
      </div>
    </main>

    <!-- BASIC FORM VALIDATION -->

    <script>
      document
        .getElementById("registerForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const password = document.getElementById("password").value;

          const confirmPassword =
            document.getElementById("confirmPassword").value;

          if (password !== confirmPassword) {
            alert("Passwords do not match!");

            return;
          }

          alert("Registration successful! Your SafeTour account is ready.");
        });
    </script>
  </body>
</html>
